services:
  postgres:
    image: postgres:16-alpine
    container_name: semarketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semarket_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-semarketplace}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - semarket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semarket} -d ${POSTGRES_DB:-semarketplace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semarketplace-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-semarket}:${POSTGRES_PASSWORD:-semarket_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-semarketplace}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-semarketplace_super_secret_jwt_key_2026_x99}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
    networks:
      - semarket-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_USE_MOCK: "false"
    container_name: semarketplace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - semarket-network

volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local

networks:
  semarket-network:
    driver: bridge
